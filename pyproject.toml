[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marker-label"
version = "0.1.0"
description = "Label marker sets in motion capture C3D files using subject-specific static trials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "c3d>=0.5",
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
qc = ["pyvista>=0.38"]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
marker-label = "marker_label.cli:main"
marker-label-inspect = "marker_label.inspect_quality:main"
marker-label-view = "marker_label.qc_viewer:main"
marker-label-compare = "marker_label.qc_viewer:main_compare"
marker-label-analyze = "marker_label.analyze_reference:main"
marker-label-trim-csv = "marker_label.trim_labeled_csv_cli:main"
marker-label-trial-trim = "marker_label.trial_trim:main"
marker-label-trim-frames = "marker_label.trim_csv_by_frames:main"
marker-label-trim-combine = "marker_label.trial_trim_combine:main"
marker-label-correct-trimmed = "marker_label.trimmed_csv_marker_correction:main"
marker-label-gap-fill = "marker_label.gap_filling.cli:main"
marker-label-synthesize-rhee = "marker_label.synthesize_rhee_from_static:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marker_label"]

[tool.hatch.build.targets.sdist]
packages = ["src/marker_label"]

[tool.pytest.ini_options]
markers = ["integration: uses bundled trial CSV data"]

[tool.ruff]
line-length = 100
target-version = "py310"
